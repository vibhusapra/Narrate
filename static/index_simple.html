<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Narrate - Voice Cloning TTS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #000;
            color: #fff;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        h1 { margin-bottom: 30px; }
        .section {
            background: #111;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }
        input, select, textarea, button {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #333;
            border-radius: 4px;
            background: #000;
            color: #fff;
            font-size: 14px;
        }
        textarea {
            min-height: 150px;
            font-family: inherit;
        }
        button {
            background: #0070f3;
            border: none;
            cursor: pointer;
            font-weight: 600;
        }
        button:hover { background: #0060df; }
        button:disabled {
            background: #333;
            cursor: not-allowed;
        }
        .voice-item {
            background: #000;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .voice-item button {
            width: auto;
            padding: 5px 15px;
            background: #dc2626;
            margin: 0;
        }
        #loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        #error {
            display: none;
            background: #dc2626;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 15px;
        }
        #result {
            display: none;
        }
        audio {
            width: 100%;
            margin-top: 10px;
        }
        .info {
            color: #888;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <h1>🎙️ Narrate - Voice Cloning TTS</h1>

    <!-- Upload Voice Section -->
    <div class="section">
        <h2>1. Upload Voice</h2>
        <label>Voice Name</label>
        <input type="text" id="voiceName" placeholder="e.g. David, Sarah">

        <label>Audio File (MP3/WAV)</label>
        <input type="file" id="audioFile" accept="audio/*">

        <label>Transcript (optional - auto-transcription available)</label>
        <textarea id="transcript" placeholder="What is said in the audio file..."></textarea>

        <button onclick="uploadVoice()">Upload Voice</button>

        <div id="voices"></div>
    </div>

    <!-- Generate Speech Section -->
    <div class="section">
        <h2>2. Generate Speech</h2>

        <label>Select Voice</label>
        <select id="voiceSelect">
            <option value="">-- Select a voice --</option>
        </select>

        <label>Text to Convert</label>
        <textarea id="textInput" placeholder="Enter the text you want to convert to speech..."></textarea>
        <div class="info">Timeout: 60s + 2s per word (max 30 min)</div>

        <button onclick="generateSpeech()">Generate Speech</button>

        <div id="loading">
            <p>⏳ Generating speech...</p>
            <p class="info">This may take a while for long texts</p>
        </div>

        <div id="error"></div>

        <div id="result">
            <h3>Generated Audio</h3>
            <audio id="audioPlayer" controls></audio>
            <button onclick="downloadAudio()">Download MP3</button>
        </div>
    </div>

    <script>
        let audioBlob = null;

        async function loadVoices() {
            try {
                const response = await fetch('/api/voices');
                const data = await response.json();

                const select = document.getElementById('voiceSelect');
                const voicesDiv = document.getElementById('voices');

                select.innerHTML = '<option value="">-- Select a voice --</option>';
                voicesDiv.innerHTML = '';

                if (data.voices.length === 0) {
                    voicesDiv.innerHTML = '<p class="info">No voices uploaded yet</p>';
                    return;
                }

                data.voices.forEach(voice => {
                    // Add to select
                    const option = document.createElement('option');
                    option.value = voice.id;
                    option.textContent = voice.name;
                    select.appendChild(option);

                    // Add to list
                    const div = document.createElement('div');
                    div.className = 'voice-item';
                    div.innerHTML = `
                        <div>
                            <strong>${voice.name}</strong>
                            <span class="info"> - ${voice.transcript_length} chars transcript</span>
                        </div>
                        <button onclick="deleteVoice('${voice.id}')">Delete</button>
                    `;
                    voicesDiv.appendChild(div);
                });
            } catch (error) {
                console.error('Failed to load voices:', error);
            }
        }

        async function uploadVoice() {
            const name = document.getElementById('voiceName').value.trim();
            const audioFile = document.getElementById('audioFile').files[0];
            const transcript = document.getElementById('transcript').value.trim();

            if (!name || !audioFile) {
                alert('Please provide a name and audio file');
                return;
            }

            const formData = new FormData();
            formData.append('name', name);
            formData.append('audio', audioFile);
            if (transcript) {
                formData.append('transcript', transcript);
            }

            try {
                const response = await fetch('/api/voices', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error(await response.text());
                }

                const data = await response.json();
                alert(`Voice "${data.name}" uploaded successfully!`);

                // Reset form
                document.getElementById('voiceName').value = '';
                document.getElementById('audioFile').value = '';
                document.getElementById('transcript').value = '';

                // Reload voices
                loadVoices();
            } catch (error) {
                alert('Upload failed: ' + error.message);
            }
        }

        async function deleteVoice(voiceId) {
            if (!confirm('Delete this voice?')) return;

            try {
                const response = await fetch(`/api/voices/${voiceId}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    loadVoices();
                }
            } catch (error) {
                alert('Delete failed: ' + error.message);
            }
        }

        async function generateSpeech() {
            const text = document.getElementById('textInput').value.trim();
            const voiceId = document.getElementById('voiceSelect').value;

            if (!text || !voiceId) {
                alert('Please enter text and select a voice');
                return;
            }

            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const result = document.getElementById('result');

            loading.style.display = 'block';
            error.style.display = 'none';
            result.style.display = 'none';

            try {
                const response = await fetch('/api/tts', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        text: text,
                        voice_id: voiceId
                    })
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(errorText);
                }

                audioBlob = await response.blob();
                const audioUrl = URL.createObjectURL(audioBlob);
                document.getElementById('audioPlayer').src = audioUrl;

                loading.style.display = 'none';
                result.style.display = 'block';
            } catch (err) {
                loading.style.display = 'none';
                error.style.display = 'block';
                error.textContent = 'Error: ' + err.message;
            }
        }

        function downloadAudio() {
            if (!audioBlob) return;

            const url = URL.createObjectURL(audioBlob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'narrate-output.mp3';
            a.click();
        }

        // Load voices on page load
        loadVoices();
    </script>
</body>
</html>
